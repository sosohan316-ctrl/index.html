<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="임명 배정판">
<title>임명 배정 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#16211c;
    --ink-soft:#3c4a43;
    --paper:#f5f3ec;
    --paper-line:#dcd6c6;
    --panel:#ffffff;
    --accent:#2c6e63;
    --accent-soft:#e4efec;
    --gold:#b8862c;
    --danger:#a4483a;
    --danger-soft:#f5e6e2;
    --radius:3px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:18px;
  }
  header.top h1{
    font-family:Georgia,"Nanum Myeongjo",serif;
    font-size:1.5rem;font-weight:700;letter-spacing:-0.01em;margin:0;
  }
  header.top .sub{font-size:0.8rem;color:var(--ink-soft);}

  nav.tabs{
    display:flex;gap:2px;margin-bottom:18px;
    border-bottom:1px solid var(--paper-line);
  }
  nav.tabs button{
    flex:1;padding:11px 6px;background:transparent;border:none;
    border-bottom:3px solid transparent;
    font-family:inherit;font-size:0.86rem;color:var(--ink-soft);
    cursor:pointer;transition:color .15s, border-color .15s;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:700;}
  nav.tabs button:hover{color:var(--ink);}

  section.view{display:none;}
  section.view.active{display:block;}

  .card{
    background:var(--panel);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  .card h2{font-size:1rem;margin:0 0 10px;font-family:Georgia,"Nanum Myeongjo",serif;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .row + .row{margin-top:8px;}

  input[type=text], input[type=tel], select{
    font-family:inherit;font-size:0.92rem;
    padding:8px 10px;border:1px solid var(--paper-line);
    border-radius:var(--radius);background:#fff;color:var(--ink);
  }
  input[type=text]:focus, input[type=tel]:focus, select:focus{
    outline:none;border-color:var(--accent);
  }
  button.btn{
    font-family:inherit;font-size:0.88rem;padding:8px 14px;
    border-radius:var(--radius);border:1px solid var(--ink);
    background:var(--ink);color:#fff;cursor:pointer;
  }
  button.btn:hover{background:#0d1512;}
  button.btn.secondary{background:#fff;color:var(--ink);border-color:var(--ink);}
  button.btn.secondary:hover{background:var(--accent-soft);}
  button.btn.danger{background:#fff;color:var(--danger);border-color:var(--danger);}
  button.btn.danger:hover{background:var(--danger-soft);}
  button.btn.small{padding:5px 10px;font-size:0.78rem;}
  button.btn.icon{padding:4px 8px;font-size:0.78rem;line-height:1;}
  button.btn:disabled{opacity:0.4;cursor:not-allowed;}

  ul.list{list-style:none;margin:0;padding:0;}
  ul.list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 2px;border-bottom:1px solid var(--paper-line);
    font-size:0.92rem;gap:8px;flex-wrap:wrap;
  }
  ul.list li:last-child{border-bottom:none;}
  ul.list .meta{color:var(--ink-soft);font-size:0.8rem;}
  ul.list .left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  ul.list .right{display:flex;align-items:center;gap:6px;}

  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-nav .label{font-family:Georgia,"Nanum Myeongjo",serif;font-size:1.15rem;min-width:120px;text-align:center;}

  .week-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:0.86rem;}
  .week-row .wk-label{flex:0 0 150px;color:var(--ink-soft);}

  .day-block{
    background:var(--panel);border:1px solid var(--paper-line);
    border-radius:var(--radius);margin-bottom:12px;overflow:hidden;
  }
  .day-block .day-head{
    background:var(--ink);color:#fff;padding:9px 14px;
    font-size:0.85rem;display:flex;justify-content:space-between;
  }
  .day-block .day-head .n{color:#d8d3c0;font-size:0.78rem;}
  .cat-banner{
    display:flex;align-items:center;gap:8px;
    padding:8px 14px;font-weight:700;font-size:0.88rem;color:#fff;
  }
  .cat-banner .swatch{
    width:16px;height:16px;border-radius:3px;background:rgba(255,255,255,0.35);
    flex:0 0 auto;
  }
  .assign-row{
    display:flex;align-items:center;gap:8px;padding:9px 14px;
    border-bottom:1px solid var(--paper-line);flex-wrap:wrap;
  }
  .assign-row:last-child{border-bottom:none;}
  .assign-row .role-name{flex:0 0 110px;font-size:0.86rem;font-weight:700;color:var(--ink-soft);}
  .assign-row .assignees{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:120px;}
  .assign-row select{flex:1;min-width:120px;max-width:180px;}
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--accent-soft);color:var(--accent);
    border-radius:14px;padding:4px 8px 4px 11px;font-size:0.82rem;
  }
  .chip button{
    background:none;border:none;color:var(--accent);font-size:0.9rem;
    cursor:pointer;padding:0;line-height:1;font-weight:700;
  }
  .empty-note{
    padding:22px 14px;text-align:center;color:var(--ink-soft);font-size:0.88rem;
  }
  .badge{
    display:inline-block;font-size:0.72rem;padding:2px 7px;border-radius:10px;
    color:#fff;flex:0 0 auto;
  }
  .reminder-card{
    border-left:4px solid var(--accent);
  }
  .reminder-item{
    background:var(--accent-soft);border-radius:var(--radius);
    padding:12px;margin-bottom:10px;
  }
  .reminder-item .txt{
    font-size:0.88rem;white-space:pre-wrap;margin:8px 0;line-height:1.5;
  }
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .note{font-size:0.8rem;color:var(--ink-soft);line-height:1.5;}
  .cat-row{display:flex;align-items:center;gap:10px;padding:7px 0;}
  .cat-row .swatch2{width:18px;height:18px;border-radius:4px;flex:0 0 auto;}
  .cat-row input[type=text]{flex:1;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;
    font-size:0.85rem;opacity:0;pointer-events:none;transition:opacity .2s;
    z-index:50;
  }
  .toast.show{opacity:1;}

  /* 인쇄 시: 설정 화면은 숨기고 스케줄만 깔끔하게 보이도록 */
  .print-only-tip{display:none;}
  body.print-mode .print-hide{ display:none !important; }
  @media print{
    .print-hide{ display:none !important; }
    .no-print{ display:none !important; }
    [id^="printModeNotice-"]{ display:none !important; }
    body{ background:#fff; }
    .app{ max-width:none; padding:0; }
    .day-block{ break-inside:avoid; page-break-inside:avoid; border-color:#999; }
    .assign-row .assignees{ min-width:0; }
    .print-only-tip{ display:block; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>임명 배정판</h1>
    <div class="sub" id="peopleCount"></div>
  </header>

  <div class="card print-hide" id="saveLoadCard" style="border-color:var(--gold);">
    <h2>데이터 저장 · 불러오기</h2>
    <p class="note" id="storageStatusNote"></p>
    <div class="row">
      <button class="btn" id="saveFileBtn">파일로 저장</button>
      <button class="btn secondary" id="loadFileBtnTrigger">파일 불러오기</button>
      <input type="file" id="loadFileInput" accept="application/json" style="display:none;">
    </div>
  </div>

  <nav class="tabs print-hide">
    <button data-tab="people" class="active">사람</button>
    <button data-tab="midweek">주중 임명</button>
    <button data-tab="weekend">주말 임명</button>
    <button data-tab="reminders">알림</button>
  </nav>

  <!-- 사람 -->
  <section class="view active" id="view-people">
    <div class="card">
      <h2>사람 등록</h2>
      <div class="row">
        <input type="text" id="personName" placeholder="이름">
        <input type="tel" id="personPhone" placeholder="연락처 (선택)">
        <button class="btn" id="addPersonBtn">추가</button>
      </div>
    </div>
    <div class="card">
      <h2>명단</h2>
      <ul class="list" id="peopleList"></ul>
    </div>
  </section>

  <!-- 주중 임명 -->
  <section class="view" id="view-midweek">
    <div id="panel-midweek"></div>
  </section>

  <!-- 주말 임명 -->
  <section class="view" id="view-weekend">
    <div id="panel-weekend"></div>
  </section>

  <!-- 알림 -->
  <section class="view" id="view-reminders">
    <div class="card reminder-card">
      <h2>알림 보내기 설정</h2>
      <p class="note">
        이 앱은 브라우저에서만 동작하기 때문에 문자나 카카오톡을 자동으로 발송할 수는 없어요.
        대신 지정한 기간 안에 임명이 있는 사람과, 바로 보낼 수 있는 알림 문구를 정리해드려요. '복사' 버튼으로 복사한 뒤 카카오톡이나 문자로 붙여넣어 보내시면 됩니다.
      </p>
      <div class="row">
        <label class="note">알림 시점:</label>
        <select id="leadDays">
          <option value="1">1일 전</option>
          <option value="2" selected>2일 전</option>
          <option value="3">3일 전</option>
        </select>
        <button class="btn secondary small" id="refreshReminders">다시 계산</button>
      </div>
    </div>
    <div class="card">
      <h2>오늘 기준 발송 대상</h2>
      <div id="reminderList"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const { jsPDF } = window.jspdf || {};
const toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

const WEEKDAY_LABELS = ['일','월','화','수','목','금','토'];
const TYPE_LABELS = { midweek: '주중 임명', weekend: '주말 임명' };

// 고정 구역(카테고리): 색은 고정, 제목만 편집 가능. 주중 임명에만 사용.
const DEFAULT_CATEGORIES = [
  { id:'treasures', label:'上帝话语的宝藏', color:'#1f7f6e' },
  { id:'ministry',  label:'用心准备传道工作', color:'#c9861a' },
  { id:'living',    label:'基督徒的生活',   color:'#c0392b' }
];

// ---------- in-memory state ----------
let people = [];  // {id, name, phone}
let rolesByType = { midweek: [], weekend: [] }; // {id, name, category} - category는 midweek에서만 의미 있음
let config = {
  categories: DEFAULT_CATEGORIES.map(c=>({...c})),
  defaultWeekday: { midweek: 2, weekend: 0 } // 0=일 ... 6=토
};
let currentMonth = new Date();
currentMonth.setDate(1);
let assignmentsByMonth = {};       // [monthKey][dateKey][roleId] = [personId,...]
let monthAssignments = {};         // 현재 보고 있는 달의 참조
let weekOverridesByMonth = {};     // [monthKey][type][weekIdx] = weekday(0-6) | null(이번주 없음)

function ensureConfigShape(){
  if(!config.categories || config.categories.length!==3){
    config.categories = DEFAULT_CATEGORIES.map(c=>({...c}));
  }
  if(!config.defaultWeekday){
    config.defaultWeekday = { midweek: 2, weekend: 0 };
  }
  if(config.defaultWeekday.midweek===undefined) config.defaultWeekday.midweek = 2;
  if(config.defaultWeekday.weekend===undefined) config.defaultWeekday.weekend = 0;
}

// 이전 버전 데이터( roles 단일배열 + config.weekdays 배열 )를 새 구조로 이관
function migrateOldShape(rawData){
  if(rawData.rolesByType) return; // 이미 새 구조
  if(Array.isArray(rawData.roles)){
    rawData.rolesByType = { midweek: rawData.roles, weekend: [] };
  }
  if(rawData.config && Array.isArray(rawData.config.weekdays)){
    const wds = rawData.config.weekdays;
    rawData.config.defaultWeekday = { midweek: wds[0]!==undefined?wds[0]:2, weekend: wds[1]!==undefined?wds[1]:0 };
    delete rawData.config.weekdays;
  }
}

function migrateRoles(){
  Object.values(rolesByType).forEach(list=>{
    list.forEach(r=>{ if(!r.category) r.category = 'common'; });
  });
}
function migrateAssignments(){
  Object.values(assignmentsByMonth).forEach(monthObj=>{
    Object.values(monthObj).forEach(dayObj=>{
      Object.keys(dayObj).forEach(roleId=>{
        const v = dayObj[roleId];
        if(v == null){ dayObj[roleId] = []; }
        else if(!Array.isArray(v)){ dayObj[roleId] = [v]; }
      });
    });
  });
}
function getAssignees(dayObj, roleId){
  let v = dayObj[roleId];
  if(v == null){ v = []; }
  else if(!Array.isArray(v)){ v = [v]; }
  dayObj[roleId] = v;
  return v;
}

// ---------- 자동 저장 ----------
let hasLocalStorage = false;
try{
  localStorage.setItem('__roster_test__','1');
  localStorage.removeItem('__roster_test__');
  hasLocalStorage = true;
}catch(e){ hasLocalStorage = false; }

const LS_KEYS = { people:'roster_people', rolesByType:'roster_rolesByType', config:'roster_config', assignments:'roster_assignments', weekOverrides:'roster_weekOverrides' };

function loadPersisted(){
  if(!hasLocalStorage) return;
  try{
    const p = localStorage.getItem(LS_KEYS.people);
    const rt = localStorage.getItem(LS_KEYS.rolesByType);
    const rtOld = localStorage.getItem('roster_roles'); // 이전 버전 호환
    const c = localStorage.getItem(LS_KEYS.config);
    const a = localStorage.getItem(LS_KEYS.assignments);
    const wo = localStorage.getItem(LS_KEYS.weekOverrides);
    if(p) people = JSON.parse(p);
    if(rt) rolesByType = JSON.parse(rt);
    else if(rtOld) rolesByType = { midweek: JSON.parse(rtOld), weekend: [] };
    if(c) config = JSON.parse(c);
    if(a) assignmentsByMonth = JSON.parse(a);
    if(wo) weekOverridesByMonth = JSON.parse(wo);
  }catch(e){ console.error('자동 불러오기 실패', e); }
  const wrap = { config, rolesByType: rolesByType && Object.keys(rolesByType).length ? rolesByType : undefined };
  ensureConfigShape();
  migrateRoles();
  migrateAssignments();
}
function persistAll(){
  if(!hasLocalStorage) return;
  try{
    assignmentsByMonth[monthKey(currentMonth)] = monthAssignments;
    localStorage.setItem(LS_KEYS.people, JSON.stringify(people));
    localStorage.setItem(LS_KEYS.rolesByType, JSON.stringify(rolesByType));
    localStorage.setItem(LS_KEYS.config, JSON.stringify(config));
    localStorage.setItem(LS_KEYS.assignments, JSON.stringify(assignmentsByMonth));
    localStorage.setItem(LS_KEYS.weekOverrides, JSON.stringify(weekOverridesByMonth));
  }catch(e){ console.error('자동 저장 실패', e); }
}
function renderStorageStatus(){
  const el = document.getElementById('storageStatusNote');
  if(hasLocalStorage){
    el.innerHTML = '이 브라우저에는 자동으로 저장돼요. 다시 열어도 그대로 남아있어요. 다른 기기로 옮기거나 백업해두려면 <strong>"파일로 저장"</strong>을 눌러 파일을 챙겨두세요.';
  }else{
    el.innerHTML = '지금 보고 있는 화면에서는 자동 저장이 되지 않아요 (새로고침하면 내용이 사라져요). 이 파일을 기기에 저장한 뒤 사파리/크롬 같은 일반 브라우저로 열면 자동 저장을 쓸 수 있어요. 그전까지는 작업 후 꼭 <strong>"파일로 저장"</strong>을 눌러 파일을 챙겨두고, 다음에 <strong>"파일 불러오기"</strong>로 이어서 작업하세요.';
  }
}

function setVal(){ persistAll(); }

function uid(){ return Math.random().toString(36).slice(2,9); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function categoryById(id){ return config.categories.find(c=>c.id===id); }
function personName(id){ const p = people.find(x=>x.id===id); return p ? p.name : ''; }

function weekdayOptionsHtml(selected, allowNone){
  let html = '';
  if(allowNone){
    html += `<option value="none" ${selected===null||selected===undefined?'selected':''}>이번 주 없음</option>`;
  }
  WEEKDAY_LABELS.forEach((label, idx)=>{
    html += `<option value="${idx}" ${String(selected)===String(idx)?'selected':''}>${label}요일</option>`;
  });
  return html;
}

// 이번 달과 겹치는 각 캘린더 주(일요일 시작)의 시작일 목록
function getWeekAnchors(monthDate){
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const firstMonday = new Date(firstOfMonth);
  // 월요일을 한 주의 시작으로 맞춘다 (일요일=0 ... 토요일=6 기준으로 월요일까지 거슬러 올라감)
  const offsetFromMonday = (firstOfMonth.getDay() + 6) % 7;
  firstMonday.setDate(firstOfMonth.getDate() - offsetFromMonday);
  const lastOfMonth = new Date(year, month+1, 0);
  const anchors = [];
  let cursor = new Date(firstMonday);
  while(cursor <= lastOfMonth){
    anchors.push(new Date(cursor));
    cursor = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate()+7);
  }
  return anchors;
}

function getMeetingDatesForType(type, monthDate){
  const monthNum = monthDate.getMonth();
  const mk = monthKey(monthDate);
  const anchors = getWeekAnchors(monthDate);
  const overridesForMonth = (weekOverridesByMonth[mk] && weekOverridesByMonth[mk][type]) || {};
  const dates = [];
  anchors.forEach((anchor, idx)=>{
    let wd;
    if(Object.prototype.hasOwnProperty.call(overridesForMonth, idx)){
      wd = overridesForMonth[idx]; // null이면 이번 주 없음
    }else{
      wd = config.defaultWeekday[type];
    }
    if(wd === null || wd === undefined) return;
    // anchor는 항상 그 주의 월요일이므로, 월요일=1 기준으로 목표 요일까지의 거리로 변환한다.
    const offsetDays = (wd - 1 + 7) % 7;
    const d = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate()+offsetDays);
    if(d.getMonth() === monthNum) dates.push(d);
  });
  return dates;
}

// ---------- init ----------
function init(){
  ensureConfigShape();
  loadPersisted();
  renderPeople();
  buildPanelSkeleton('midweek');
  buildPanelSkeleton('weekend');
  renderTypeAll('midweek');
  renderTypeAll('weekend');
  loadMonth();
  renderPeopleCount();
  renderStorageStatus();
  bindTabs();
  bindPeople();
  bindReminders();
  bindSaveLoad();
  renderReminders();
}
init();

// ---------- 파일로 저장 / 불러오기 ----------
function bindSaveLoad(){
  document.getElementById('saveFileBtn').addEventListener('click', saveToFile);
  const trigger = document.getElementById('loadFileBtnTrigger');
  const input = document.getElementById('loadFileInput');
  trigger.addEventListener('click', ()=> input.click());
  input.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        migrateOldShape(data);
        people = data.people || [];
        rolesByType = data.rolesByType || { midweek: [], weekend: [] };
        config = data.config || { categories: DEFAULT_CATEGORIES.map(c=>({...c})), defaultWeekday:{midweek:2,weekend:0} };
        assignmentsByMonth = data.assignmentsByMonth || {};
        weekOverridesByMonth = data.weekOverridesByMonth || {};
        ensureConfigShape();
        migrateRoles();
        migrateAssignments();
        renderPeople();
        renderTypeAll('midweek');
        renderTypeAll('weekend');
        renderPeopleCount();
        loadMonth();
        renderReminders();
        persistAll();
        toast('불러왔어요');
      }catch(err){
        toast('파일을 읽을 수 없어요. 이 프로그램에서 저장한 파일인지 확인해주세요.');
      }
    };
    reader.readAsText(file);
    input.value = '';
  });
}
function saveToFile(){
  assignmentsByMonth[monthKey(currentMonth)] = monthAssignments;
  const payload = { people, rolesByType, config, assignmentsByMonth, weekOverridesByMonth, savedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `임명배정_데이터_${dateKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('파일로 저장했어요');
}

function renderPeopleCount(){
  const total = rolesByType.midweek.length + rolesByType.weekend.length;
  document.getElementById('peopleCount').textContent = `사람 ${people.length}명 · 임명 ${total}개`;
}

// ---------- tabs ----------
function bindTabs(){
  document.querySelectorAll('nav.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('section.view').forEach(v=>v.classList.remove('active'));

      document.getElementById('view-'+btn.dataset.tab).classList.add('active');

      if(btn.dataset.tab === 'weekend') renderTypeAll('weekend');
      if(btn.dataset.tab === 'reminders') renderReminders();
    });

// ---------- people ----------
function bindPeople(){
  document.getElementById('addPersonBtn').addEventListener('click', ()=>{

// ---------- 임명 목록 ----------

  const ul = document.getElementById('rolesList-'+type);
  const roles = rolesByType[type];
  ul.innerHTML = '';
  if(roles.length===0){
    ul.innerHTML = '<li class="empty-note" style="border:none;">등록된 임명이 없어요.</li>';
    return;
  }
  const isMidweek = type === 'midweek';
  roles.forEach((r, idx)=>{
    const li = document.createElement('li');
    const left = document.createElement('div');
    left.className = 'left';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = r.name;
    left.appendChild(nameSpan);
    if(isMidweek){
      const cat = categoryById(r.category);
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.background = cat ? cat.color : '#8b8b83';
      badge.textContent = cat ? cat.label : '공통';
      left.appendChild(badge);
    }

    const right = document.createElement('div');
    right.className = 'right';

    if(isMidweek){
      const catSelect = document.createElement('select');
      catSelect.innerHTML = `<option value="common">공통</option>` +
        config.categories.map(c=>`<option value="${c.id}">${escapeHtml(c.label)}</option>`).join('');
      catSelect.value = r.category || 'common';
      catSelect.addEventListener('change', ()=>{
        r.category = catSelect.value;
        setVal();
        renderRoles(type); renderSchedule(type);
      });
      right.appendChild(catSelect);
    }

    const upBtn = document.createElement('button');
    upBtn.className = 'btn secondary icon';
    upBtn.textContent = '↑';
    upBtn.disabled = idx===0;
    upBtn.addEventListener('click', ()=>{
      [roles[idx-1], roles[idx]] = [roles[idx], roles[idx-1]];
      setVal();
      renderRoles(type); renderSchedule(type);
    });

    const downBtn = document.createElement('button');
    downBtn.className = 'btn secondary icon';
    downBtn.textContent = '↓';
    downBtn.disabled = idx===roles.length-1;
    downBtn.addEventListener('click', ()=>{
      [roles[idx+1], roles[idx]] = [roles[idx], roles[idx+1]];
      setVal();
      renderRoles(type); renderSchedule(type);
    });

    const del = document.createElement('button');
    del.className='btn danger small';
    del.textContent='삭제';
    del.addEventListener('click', ()=>{
      rolesByType[type] = rolesByType[type].filter(x=>x.id!==r.id);
      setVal();
      renderRoles(type); renderPeopleCount(); renderSchedule(type);
    });

    right.appendChild(upBtn);
    right.appendChild(downBtn);
    right.appendChild(del);

    li.appendChild(left);
    li.appendChild(right);
    ul.appendChild(li);
  });
}

// ---------- 주차별 요일 설정 패널 ----------
function renderWeekPanel(type){
  const box = document.getElementById('weekPanel-'+type);
  if(!box) return;
  box.innerHTML = '';
  const mk = monthKey(currentMonth);
  if(!weekOverridesByMonth[mk]) weekOverridesByMonth[mk] = {};
  if(!weekOverridesByMonth[mk][type]) weekOverridesByMonth[mk][type] = {};
  const overrides = weekOverridesByMonth[mk][type];

  const anchors = getWeekAnchors(currentMonth);
  anchors.forEach((anchor, idx)=>{
    const row = document.createElement('div');
    row.className = 'week-row';
    const rangeEnd = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate()+6);
    const label = `${idx+1}주차 (${anchor.getMonth()+1}/${anchor.getDate()}~${rangeEnd.getMonth()+1}/${rangeEnd.getDate()})`;
    row.innerHTML = `<span class="wk-label">${label}</span>`;
    const sel = document.createElement('select');
    const currentVal = Object.prototype.hasOwnProperty.call(overrides, idx) ? overrides[idx] : config.defaultWeekday[type];
    sel.innerHTML = weekdayOptionsHtml(currentVal, true);
    sel.addEventListener('change', ()=>{
      overrides[idx] = sel.value === 'none' ? null : parseInt(sel.value, 10);
      setVal();
      loadMonth();
    });
    row.appendChild(sel);
    box.appendChild(row);
  });
}

// ---------- 월 스케줄 ----------
function loadMonth(){
  const key = monthKey(currentMonth);
  if(!assignmentsByMonth[key]) assignmentsByMonth[key] = {};
  monthAssignments = assignmentsByMonth[key];
  renderWeekPanel('midweek');
  renderWeekPanel('weekend');
  renderSchedule('midweek');
  renderSchedule('weekend');
}

function renderSchedule(type){
  const monthLabelEl = document.getElementById('monthLabel-'+type);
  if(monthLabelEl) monthLabelEl.textContent = `${currentMonth.getFullYear()}년 ${currentMonth.getMonth()+1}월`;
  const body = document.getElementById('scheduleBody-'+type);
  if(!body) return;
  body.innerHTML = '';
  const roles = rolesByType[type];
  const noteEl = document.getElementById('scheduleNote-'+type);

  if(roles.length===0){
    body.innerHTML = `<div class="card"><p class="empty-note">먼저 위에서 ${TYPE_LABELS[type]}을 추가해주세요.</p></div>`;
    if(noteEl) noteEl.textContent='';
    return;
  }

  const dates = getMeetingDatesForType(type, currentMonth);
  if(noteEl) noteEl.textContent = `이번 달 모임 ${dates.length}회`;

  if(dates.length===0){
    body.innerHTML = '<div class="card"><p class="empty-note">이번 달에는 설정된 모임일이 없어요.</p></div>';
    return;
  }

  const isMidweek = type === 'midweek';

  dates.forEach(dt=>{
    const dk = dateKey(dt);
    if(!monthAssignments[dk]) monthAssignments[dk] = {};
    const dayObj = monthAssignments[dk];
    const block = document.createElement('div');
    block.className = 'day-block';
    const head = document.createElement('div');
    head.className = 'day-head';
    head.innerHTML = `<span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${WEEKDAY_LABELS[dt.getDay()]})</span><span class="n">${roles.length}개 임명</span>`;
    block.appendChild(head);

    let lastCategory = null;
    roles.forEach(role=>{
      if(isMidweek && role.category !== lastCategory){
        if(role.category !== 'common'){
          const cat = categoryById(role.category);
          if(cat){
            const banner = document.createElement('div');
            banner.className = 'cat-banner';
            banner.style.background = cat.color;
            banner.innerHTML = `<span class="swatch"></span><span>${escapeHtml(cat.label)}</span>`;
            block.appendChild(banner);
          }
        }
        lastCategory = role.category;
      }

      const row = document.createElement('div');
      row.className = 'assign-row';
      row.innerHTML = `<span class="role-name">${escapeHtml(role.name)}</span>`;

      const assigneesBox = document.createElement('div');
      assigneesBox.className = 'assignees';

      function refreshChips(){
        assigneesBox.innerHTML = '';
        const ids = getAssignees(dayObj, role.id);
        ids.forEach(pid=>{
          const p = people.find(x=>x.id===pid);
          if(!p) return;
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.innerHTML = `${escapeHtml(p.name)} `;
          const rm = document.createElement('button');
          rm.textContent = '×';
          rm.className = 'no-print';
          rm.addEventListener('click', ()=>{
            dayObj[role.id] = ids.filter(x=>x!==pid);
            setVal();
            refreshChips();
            refreshAddSelect();
          });
          chip.appendChild(rm);
          assigneesBox.appendChild(chip);
        });
      }

      const addSelect = document.createElement('select');
      addSelect.className = 'no-print';
      function refreshAddSelect(){
        const ids = getAssignees(dayObj, role.id);
        const available = people.filter(p=>!ids.includes(p.id));
        addSelect.innerHTML = `<option value="">+ 사람 추가</option>` +
          available.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
      }
      addSelect.addEventListener('change', ()=>{
        if(!addSelect.value) return;
        const ids = getAssignees(dayObj, role.id);
        ids.push(addSelect.value);
        dayObj[role.id] = ids;
        setVal();
        refreshChips();
        refreshAddSelect();
      });

      refreshChips();
      refreshAddSelect();

      row.appendChild(assigneesBox);
      row.appendChild(addSelect);
      block.appendChild(row);
    });
    body.appendChild(block);
  });
}

// ---------- PDF 내보내기 ----------
async function exportPdf(type){
  if(!jsPDF){ toast('PDF 라이브러리를 불러오지 못했어요'); return; }
  const dates = getMeetingDatesForType(type, currentMonth);
  const roles = rolesByType[type];
  if(dates.length===0 || roles.length===0){ toast('내보낼 스케줄이 없어요'); return; }

  const PAGE_W = 595, PAGE_H = 842;
  const SCALE = 2;
  const marginX = 40;
  const pageRight = 555;
  const colRoleW = 150;
  const isMidweek = type === 'midweek';

  let canvas, ctx;
  const pageImages = [];

  function newPage(){
    canvas = document.createElement('canvas');
    canvas.width = PAGE_W * SCALE;
    canvas.height = PAGE_H * SCALE;
    ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, PAGE_W, PAGE_H);
    ctx.textBaseline = 'alphabetic';
  }
  function commitPage(){ pageImages.push(canvas.toDataURL('image/png')); }

  newPage();
  let y = 50;
  ctx.fillStyle = '#141e19';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText(`${currentMonth.getFullYear()}년 ${currentMonth.getMonth()+1}월 ${TYPE_LABELS[type]} 스케줄`, marginX, y);
  y += 26;

  dates.forEach(dt=>{
    if(y > 740){ commitPage(); newPage(); y = 50; }
    const dk = dateKey(dt);
    const dayObj = monthAssignments[dk] || {};

    ctx.fillStyle = '#141e19';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`${dt.getMonth()+1}월 ${dt.getDate()}일 (${WEEKDAY_LABELS[dt.getDay()]})`, marginX, y);
    y += 6;
    ctx.strokeStyle = '#b4b4b4';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(marginX, y + 0.5);
    ctx.lineTo(pageRight, y + 0.5);
    ctx.stroke();
    y += 16;

    let lastCategory = null;
    roles.forEach(role=>{
      if(y > 770){ commitPage(); newPage(); y = 50; }

      if(isMidweek && role.category !== lastCategory){
        if(role.category !== 'common'){
          const cat = categoryById(role.category);
          if(cat){
            ctx.fillStyle = cat.color;
            ctx.fillRect(marginX, y - 13, pageRight - marginX, 20);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText(cat.label, marginX + 8, y + 1);
            y += 20;
          }
        }
        lastCategory = role.category;
      }

      const ids = getAssignees(dayObj, role.id);
      const namesText = ids.length ? ids.map(personName).filter(Boolean).join(' · ') : '(미배정)';
      ctx.fillStyle = '#141e19';
      ctx.font = '11px sans-serif';
      ctx.fillText(role.name, marginX + 4, y);
      ctx.fillText(namesText, marginX + colRoleW, y);
      y += 18;
    });
    y += 14;
  });
  commitPage();

  const doc = new jsPDF({ unit:'pt', format:'a4' });
  pageImages.forEach((imgData, idx)=>{
    if(idx>0) doc.addPage();
    doc.addImage(imgData, 'PNG', 0, 0, PAGE_W, PAGE_H);
  });

  const filename = `${TYPE_LABELS[type]}_${currentMonth.getFullYear()}-${String(currentMonth.getMonth()+1).padStart(2,'0')}.pdf`;
  const blob = doc.output('blob');
  const blobUrl = URL.createObjectURL(blob);

  const box = document.getElementById('pdfResultBox-'+type);
  const link = document.getElementById('pdfOpenLink-'+type);
  link.textContent = `${filename} 열기`;
  link.onclick = ()=>{
    // 같은 탭 안에서 실제 PDF 문서로 이동시킨다.
    // (target=_blank 링크는 이 웹뷰에서 새 탭을 못 열 수 있어, 같은 화면을 그대로 이동시키는 방식이 더 확실하다.)
    window.location.href = blobUrl;
  };
  box.style.display = 'block';
  box.scrollIntoView({ behavior:'smooth', block:'center' });

  try{
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){ /* 자동 다운로드가 막혀도 위 링크로 열 수 있음 */ }

  toast('PDF가 준비됐어요. 아래 링크를 확인하세요');
}

// ---------- reminders ----------
function bindReminders(){
  document.getElementById('refreshReminders').addEventListener('click', renderReminders);
  document.getElementById('leadDays').addEventListener('change', renderReminders);
}

function renderReminders(){
  const lead = parseInt(document.getElementById('leadDays').value, 10);
  const listEl = document.getElementById('reminderList');
  listEl.innerHTML = '';

  const today = new Date();
  today.setHours(0,0,0,0);
  const monthsToCheck = [new Date(today.getFullYear(), today.getMonth(), 1), new Date(today.getFullYear(), today.getMonth()+1, 1)];
  let found = [];

  ['midweek','weekend'].forEach(type=>{
    const roles = rolesByType[type];
    monthsToCheck.forEach(m=>{
      const key = monthKey(m);
      const data = assignmentsByMonth[key] || {};
      const dates = getMeetingDatesForType(type, m);
      dates.forEach(dt=>{
        const diffDays = Math.round((dt - today) / 86400000);
        if(diffDays === lead){
          const dk = dateKey(dt);
          const dayObj = data[dk] || {};
          roles.forEach(role=>{
            const ids = getAssignees(dayObj, role.id);
            ids.forEach(pid=>{
              found.push({ date: dt, role, personId: pid, type });
            });
          });
        }
      });
    });
  });

  if(found.length===0){
    listEl.innerHTML = `<p class="empty-note">${lead}일 뒤 모임에 배정된 임명이 없어요.</p>`;
    return;
  }

  found.forEach(item=>{
    const p = people.find(x=>x.id===item.personId);
    if(!p) return;
    const dt = item.date;
    const dateStr = `${dt.getMonth()+1}월 ${dt.getDate()}일 (${WEEKDAY_LABELS[dt.getDay()]})`;
    const msg = `[모임 안내]\n${p.name}님, ${dateStr} ${TYPE_LABELS[item.type]}에서 '${item.role.name}' 임명을 맡아주세요.\n미리 준비 부탁드립니다. 감사합니다!`;
    const box = document.createElement('div');
    box.className = 'reminder-item';
    box.innerHTML = `
      <strong>${escapeHtml(p.name)}</strong>
      <span class="badge" style="background:var(--gold);">${escapeHtml(item.role.name)}</span>
      <span class="meta"> · ${dateStr} · ${TYPE_LABELS[item.type]}</span>
      <div class="txt">${escapeHtml(msg)}</div>
    `;
    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn secondary small';
    copyBtn.textContent = '문구 복사';
    copyBtn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(msg);
        toast('복사했어요. 카카오톡/문자에 붙여넣으세요.');
      }catch(e){ toast('복사에 실패했어요'); }
    });
    box.appendChild(copyBtn);
    listEl.appendChild(box);
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
